name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            syslinux syslinux-common isolinux git ca-certificates

      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the ISO
        run: |
          chmod +x build.sh config/hooks/normal/*.hook.chroot
          ./build.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: sindhi-linux-iso
          path: "*.iso"
          retention-days: 14
          compression-level: 0
