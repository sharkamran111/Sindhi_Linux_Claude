name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
            syslinux syslinux-common isolinux git ca-certificates \
            librsvg2-bin fonts-sil-lateef fonts-dejavu-core

      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the ISO
        run: |
          chmod +x build.sh config/hooks/normal/*.hook.chroot
          ./build.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: sindhi-linux-iso
          path: "*.iso"
          retention-days: 14
          compression-level: 0

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 imagemagick socat

      - name: Get the ISO
        uses: actions/download-artifact@v4
        with:
          name: sindhi-linux-iso

      - name: Boot it and take screenshots
        run: |
          ISO=$(ls *.iso | head -1)
          mkdir -p shots
          qemu-system-x86_64 -enable-kvm -m 2048 -smp 2 -cdrom "$ISO" -boot d \
            -vga std -display none -monitor unix:/tmp/qmp.sock,server,nowait &
          snap() { sleep "$1"; echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/qmp.sock >/dev/null; sleep 1; convert /tmp/s.ppm "shots/$2.png"; echo "took $2"; }
          snap 8 00-boot-menu
          echo "sendkey ret" | socat - UNIX-CONNECT:/tmp/qmp.sock >/dev/null
          for i in $(seq -w 1 20); do snap 2 "01-boot-$i"; done
          snap 20 02-desktop
          snap 30 03-desktop-later
          key() { echo "sendkey $1" | socat - UNIX-CONNECT:/tmp/qmp.sock >/dev/null; sleep 0.3; }
          # Open the text editor
          key alt-f2; sleep 3
          for k in m o u s e p a d; do key $k; done; key ret; sleep 8
          snap 1 04-editor-english
          # Switch to Roman Sindhi and type: سنڌي ٻولي گھر جھڙو۔
          key meta_l-spc; sleep 2
          for k in shift-b shift-u t shift-y spc c shift-w shift-s shift-y spc shift-q y spc m z shift-w dot; do key $k; done
          sleep 1
          snap 1 05-typed-sindhi
          # Back to English, then open the keyboard guide
          key meta_l-spc; sleep 2
          key alt-f2; sleep 3
          for k in f i r e f o x minus e s r spc slash u s r slash s h a r e slash s i n d h i minus l i n u x slash k e y b o a r d minus g u i d e slash i n d e x dot h t m l; do key $k; done
          sleep 1; key ret; sleep 2; key ret
          snap 30 06-keyboard-guide
          echo "quit" | socat - UNIX-CONNECT:/tmp/qmp.sock >/dev/null || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots
          path: shots/

      - name: Save screenshots to the boot-screenshots branch
        run: |
          cd shots
          git init -q -b boot-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Boot screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" boot-screenshots
