<?xml version="1.0" encoding="UTF-8"?>
<!-- SindhOS: Sindhi topi, front view. Original artwork for SindhOS.
     Pillbox cap with a rounded crown, the arched opening in front,
     embroidery and small round mirrors, in the ajrak palette (branding/palette.md). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="cap">
      <path d="M8 55 L9.6 25 C10 16.5 15 13 24 12.6 L40 12.6 C49 13 54 16.5 54.4 25 L56 55 Z"/>
    </clipPath>
    <mask id="arch">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M25.6 56 V44 C25.6 38.6 29.2 35.4 32 33.4 C34.8 35.4 38.4 38.6 38.4 44 V56 Z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#arch)">
    <g clip-path="url(#cap)">
      <rect x="0" y="0" width="64" height="64" fill="#9B1B1E"/>
      <!-- crown -->
      <rect x="0" y="0" width="64" height="23.5" fill="#1F2A5A"/>
      <path d="M0 23.5 H64" stroke="#F6F1E7" stroke-width="1.4"/>
      <path d="M0 26 H64" stroke="#141414" stroke-width="0.9" stroke-dasharray="2 1.6"/>
      <g fill="#F6F1E7">
        <circle cx="32" cy="17.6" r="2.3"/>
        <circle cx="22.5" cy="18.4" r="1.4"/><circle cx="41.5" cy="18.4" r="1.4"/>
        <circle cx="14.5" cy="20.4" r="1.1"/><circle cx="49.5" cy="20.4" r="1.1"/>
      </g>
      <path d="M26.6 17.6 l2.2 -2.2 l2.2 2.2 l-2.2 2.2 z M33 17.6 l2.2 -2.2 l2.2 2.2 l-2.2 2.2 z" fill="#9B1B1E"/>
      <!-- body embroidery: diamonds with mirrors -->
      <g fill="#141414">
        <path d="M11 37 l4 -4 l4 4 l-4 4 z"/><path d="M45 37 l4 -4 l4 4 l-4 4 z"/>
        <path d="M18.5 30.5 l2.6 -2.6 l2.6 2.6 l-2.6 2.6 z"/><path d="M40.3 30.5 l2.6 -2.6 l2.6 2.6 l-2.6 2.6 z"/>
      </g>
      <g fill="#F6F1E7" stroke="#141414" stroke-width="0.7">
        <circle cx="15" cy="37" r="1.5"/><circle cx="49" cy="37" r="1.5"/>
        <circle cx="13.5" cy="45" r="1.5"/><circle cx="50.5" cy="45" r="1.5"/>
        <circle cx="20.5" cy="44" r="1.3"/><circle cx="43.5" cy="44" r="1.3"/>
      </g>
      <!-- base band -->
      <rect x="0" y="50" width="64" height="14" fill="#1F2A5A"/>
      <path d="M0 50 H64" stroke="#F6F1E7" stroke-width="1.2"/>
      <!-- arch trim -->
      <path d="M23.4 56 V43.6 C23.4 37.2 28 33.6 32 31 C36 33.6 40.6 37.2 40.6 43.6 V56" fill="none" stroke="#F6F1E7" stroke-width="1.7"/>
    </g>
    <path d="M8 55 L9.6 25 C10 16.5 15 13 24 12.6 L40 12.6 C49 13 54 16.5 54.4 25 L56 55 Z" fill="none" stroke="#141414" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
