<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SindhOS: use fonts that draw every Sindhi letter correctly -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>sd</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lateef</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Naskh Arabic</family><family>Lateef</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Noto Naskh Arabic</family><family>Lateef</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Noto Naskh Arabic</family><family>Lateef</family></prefer>
  </alias>
</fontconfig>
